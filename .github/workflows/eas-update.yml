name: Publish EAS Update

on:
  push:
    branches: [main, claude/campus-golf-mapper-c8uonc]
    paths: ["mobile/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: "EAS Update branch/channel to publish to (leave blank to auto-pick: main -> production, anything else -> preview)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Link EAS project (first run only)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json; then
            npx --yes eas-cli@latest init --non-interactive --force
          else
            echo "EAS project already linked, skipping init."
          fi

      - name: Commit EAS project id if it changed
        run: |
          if ! git diff --quiet -- mobile/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mobile/app.json
            git commit -m "Link EAS project [skip ci]"
            git push
          fi

      - name: List EAS channels (diagnostic)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest status --json --non-interactive || true

      - name: Publish update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          FULL_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # Passed via env var (not spliced into the script) so quotes/newlines
          # in the commit message can't break shell parsing. Just the first
          # line, since EAS update messages are meant to be short summaries.
          UPDATE_MESSAGE=$(printf '%s' "${FULL_COMMIT_MESSAGE:-Manual publish}" | head -1)

          if [ -n "$INPUT_BRANCH" ]; then
            TARGET_BRANCH="$INPUT_BRANCH"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET_BRANCH="production"
          else
            TARGET_BRANCH="preview"
          fi
          echo "Publishing to EAS Update branch: $TARGET_BRANCH"

          npx --yes eas-cli@latest update \
            --branch "$TARGET_BRANCH" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
